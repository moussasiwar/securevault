{% extends "base.html" %}
{% block body %}
<div class="app-shell">
  <div class="dash-header">
    <h1>Journaux d'audit</h1>
    <a href="{{ url_for('admin_users') }}" class="logout-link">Utilisateurs</a>
  </div>
  <table class="data-table">
    <thead>
      <tr><th>Date</th><th>Utilisateur</th><th>Action</th><th>Détails</th></tr>
    </thead>
    <tbody>
      {% for l in logs %}
      <tr>
        <td>{{ l.created_at }}</td>
        <td>{{ l.username or '—' }}</td>
        <td>{{ l.action }}</td>
        <td>{{ l.details }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
