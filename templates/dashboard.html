{% extends "base.html" %}
{% block body %}
<div class="app-shell">
  <div class="dash-header">
    <div>
      <h1>Bienvenue, {{ user.username }}</h1>
      <div class="meta-row">
        <span class="role-badge {{ 'role-badge--admin' if user.role == 'admin' }}">{{ user.role }}</span>
      </div>
    </div>
    <a href="{{ url_for('logout') }}" class="logout-link">Se déconnecter</a>
  </div>

  {% if user.role == 'admin' %}
  <a href="{{ url_for('admin_users') }}" style="text-decoration:none;">
    <div class="panel panel--link" style="margin-bottom:1rem;">
      <a href="{{ url_for('admin_users') }}">Administration</a>
    </div>
  </a>
  {% endif %}

  <a href="{{ url_for('notes_list') }}" style="text-decoration:none;">
    <div class="panel panel--link">
      <a href="{{ url_for('notes_list') }}">Voir mes notes</a>
    </div>
  </a>
</div>
{% endblock %}
