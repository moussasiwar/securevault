{% extends "base.html" %}
{% block body %}
<div class="app-shell">
  <div class="dash-header">
    <div>
      <h1>Bienvenue, {{ user.username }}</h1>
      <div class="meta-row">
        <span class="role-badge {{ 'role-badge--admin' if user.role == 'admin' }}">{{ user.role }}</span>
      </div>
    </div>
    <a href="{{ url_for('logout') }}" class="logout-link">Se déconnecter</a>
  </div>

  {% if user.role == 'admin' %}
<div class="panel" style="margin-top:1rem;">
  <p><a href="{{ url_for('admin_users') }}" style="color:var(--accent);">Administration →</a></p>
</div>
{% endif %}
  <div class="panel">
  <p><a href="{{ url_for('notes_list') }}" style="color:var(--accent);">Voir mes notes →</a></p>
</div>
</div>
{% endblock %}
