{% extends "base.html" %}
{% block body %}
<div class="app-shell">
  <div class="dash-header">
    <h1>{{ note.title }}</h1>
    <a href="{{ url_for('notes_list') }}" class="logout-link">Retour</a>
  </div>
  <div class="panel">
    <p style="white-space:pre-wrap;">{{ note.content }}</p>
    <div class="meta-row">Créée le {{ note.created_at }}</div>
  </div>
  <div style="margin-top:1rem; display:flex; gap:0.75rem;">
    <a href="{{ url_for('notes_edit', note_id=note.id) }}" class="edit-link">
      <svg class="edit-link__pencil" viewBox="0 0 16 16" fill="none">
        <path d="M11 2.5 13.5 5 5 13.5H2.5V11L11 2.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
      Modifier
    </a>  
  <form method="POST" action="{{ url_for('notes_delete', note_id=note.id) }}" onsubmit="return confirm('Supprimer cette note ?');">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn-danger">Supprimer</button>
    </form>
  </div>
</div>
{% endblock %}
